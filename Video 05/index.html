<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table, Images, Lists</title>
    <style>
        td, th{
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <img width="830px" height="500px" src="Buggatti.png" alt="Buggatti">
    <caption>Favourite cars</caption>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Favourite Car</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
                <td>Aritra</td>
                <td>BMW M4 CS</td>
                <td>1 Crore+</td>
        </tbody>
        <tfoot>
            <tr>

                <td colspan="3">Abir</td>
                </tr>
        </tfoot>
    </table>
    <ul type="circle">
        <li>Abir</li>
        <li>Rajdip</li>
    </ul>
    <ol type="i">
        <li>Aritra</li>
        <li>Kaushtav</li>
    </ol>
    
</body>
</html>
