<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
</head>

<body>
    <form action="">
    <h1>Event Registration</h1>
    <div>
        <label for="name">Enter your name</label>
        <input id="name" type="text" name="name" placeholder="Enter your name">
    </div>
    &nbsp;
    <div>
        <label for="Email">Enter your Email</label>
        <input id="Email" type="email" name="email" placeholder="Enter your Email">
    </div>
    &nbsp;
    <div>
        <label for="date">Enter your date</label>
        <input id="date" type="date" name="date" placeholder="Enter your date">
    </div>
    &nbsp;
    <div>
        <input type="radio" id="A" name="section" value="A">
        <label for="A">Section A</label>
        <input type="radio" id="B" name="section" value="B">
        <label for="B">Section B</label>
        </div>
        &nbsp;
        <div>
    <input type="checkbox" id="checkbox" name="interest" value="yes">
<label for="checkbox">Are you interested?</label>
    </div>
    &nbsp;
    <div>
        <label for="select">Select your type</label>
        <select id="select" name="type">
      <option value="student">Student</option>
      <option value="regular">Regular</option>
      <option value="VIP">VIP</option>
</select>
    </div>
    &nbsp;
    
    <div>
              <label for="message">Enter your message</label>
<textarea id="message" name="comment" rows="4" cols="50"></textarea>
    </div>
    
    </form>

</body>
</html>
