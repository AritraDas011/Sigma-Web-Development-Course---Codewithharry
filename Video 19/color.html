<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        .keywords{
            color: darkgreen;
        }
        .hex{
            color: #0D827F;
        }
        .rgb{
            color: rgb(116 89 27 );
        }
        .rgba{
            color: rgba(87, 28, 121, 0.329);
        }
        .hsl{
            color: hsl(35, 57%, 20%);
        }
    </style>
</head>
<body>
    <h1>Colors</h1>
    <h2>About colors</h2>
    <p class="keywords">Color keywords</p>
    <p class="hex">Hex color</p>
    <p class="rgb">RGB color</p>
    <p class="rgba">RGBA color</p>
    <p class="hsl">HSL color</p>
</body>
</html>
