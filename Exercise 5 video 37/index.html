<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5</title>
    <style>
        header {
            position: sticky;
            top: 0px;
            left: 0px;
        }

        * {
            margin: 0;
            padding: 0;
        }

        .boxes {
            background-color: rgb(6, 92, 6);
            width: 90vw;
            height: 90vh;
            margin: 20px 55px;
            padding: 10px;
            display: flex;
        }

        nav {
            display: flex;
            background-color: pink;
            width: 100%;
            height: 70px;

        }

        .box1 {
            background-color: aqua;
        }

        .box2 {
            background-color: coral;
        }

        .box {
            width: 450px;
            height: 450px;
            margin: 60px;
            padding: 50px;
        }

        .content {
            text-align: center;
            font-size: 40px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            padding: 50px;
            margin: 10px;
            border: 2px solid black;
            border-radius: 60px;
            display: inline-block;

        }

        .parent {
            text-align: center;
        }

        nav li {
            border: 1px solid rgb(119, 5, 71);
            list-style: none;
            padding: 34px;
            color: white;
        }

        li:hover {
            background-color: rgb(119, 5, 71);
            color: white;
        }

        ul {
            display: flex;
        }

        a {
            text-decoration: none;
            color: white;
        }

        footer {
            width: 100%;
            height: 100px;
            background-color: bisque;
        }

        svg {
            position: fixed;
            bottom: 5px;
            right: 5px;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Services</a></li>
                <li><a href="/">Contact</a></li>

            </ul>
        </nav>
    </header>
    <main>
        <div class="boxes">
            <div class="box1 box"></div>
            <div class="box2 box"></div>
        </div>
        <div class="parent">
            <div class="content">
                Welcome to this sigma web development express
            </div>
        </div>

    </main>
    <footer>
        <svg height="100" width="100">
            <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="orange" />
        </svg>
    </footer>
</body>

</html>
