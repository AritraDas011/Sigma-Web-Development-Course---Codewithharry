<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .container {
            width: 50vw;
            height: 40vh;
            background-color: blanchedalmond;


        }

        .box {
            background-color: aquamarine;
            height: 5vh;
            width: 5vw;
        }

        .translate {
            transform: translateX(15vw) translateY(15vh) scale(2);
            transition-property: all;
            transition-duration: 2s;
            transition-timing-function: cubic-bezier(0.6, 0.49, 0.04, 0.81);
            transition-delay: 1s;
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box translate">

        </div>
    </div>
</body>

</html>
