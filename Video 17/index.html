<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box model</title>
    <style>
        .box {
            color: darkolivegreen;
            height: 200px;
            box-sizing: border-box;
        }

        .box1 {
            padding: 35px;
            background-color: aqua;
            margin: 30px;
        }

        .box2 {
            background-color: red;
            padding: 25px;
            margin: 25px;
        }
    </style>
</head>

<body>
    <div class="box box1">
        Hi I am a box
    </div>
    <div class="box box2">
        I am also another box
    </div>
</body>

</html>
